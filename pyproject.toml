[project]
name = "scriptmaker"
version = "0.1.0"
description = "Local web app that turns study material into styled HTML study scripts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.54,<0.55",
    "jinja2>=3.1.6,<4",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "pypdfium2>=5.14,<6",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0.2,<2",
    "pillow>=12.3,<13",
    "opencv-python-headless>=5.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14,<4",
    "fsrs>=6.3,<7",
    "apscheduler>=3.11,<4",
    "winotify>=1.1; sys_platform == 'win32'",
    "icalendar>=7.3,<8",
    "keyring>=25.7,<26",
    "pyyaml>=6",
]

[project.optional-dependencies]
docling = ["docling>=2.135,<3"]
gemini = ["google-genai>=2.29,<3"]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15",
    "aiosmtpd>=1.4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriptmaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "golden: needs the real sample folder (set SM_SAMPLE_DIR); skipped otherwise",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
